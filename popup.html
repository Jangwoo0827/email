<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 600px; }
    [hidden] { display: none !important; }
    a { color: var(--accent); cursor: pointer; }
    .layout { display: grid; grid-template-columns: 170px 1fr; min-height: 480px; }

    /* 왼쪽: 계정 */
    aside { border-right: 1px solid var(--border); background: var(--field); padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
    aside h2 { margin: 0 4px 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .acct { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
    .acct:hover { background: var(--border); }
    .acct.active { background: var(--accent); color: var(--accent-fg); }
    .acct.active .hint { color: inherit; opacity: .85; }
    .avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
    .acct .info { min-width: 0; flex: 1; }
    .acct .email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
    .acct .hint { font-size: 11px; }
    .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; text-align: center; }
    .badge:empty { display: none; }
    .aside-msg { font-size: 12px; color: var(--muted); padding: 4px; }
    .aside-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
    .aside-foot button { font-size: 12px; padding: 5px 8px; }

    /* 오른쪽 */
    main { padding: 12px 14px; min-width: 0; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
    .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; color: var(--muted); }
    .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
    .from-line { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .from-line b { color: var(--fg); }
    #recipients { border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; }
    .recipient { margin: 0; padding: 6px 10px; cursor: pointer; }
    .recipient + .recipient { border-top: 1px solid var(--border); }
    .recipient:hover { background: var(--field); }
    #empty { display: none; margin-top: 10px; padding: 12px; border: 1px dashed var(--border); border-radius: 8px; text-align: center; }
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }

    .inbox-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    #mailList { max-height: 400px; overflow-y: auto; margin-top: 6px; }
    .mail { display: block; padding: 8px 4px; border-bottom: 1px solid var(--border); color: inherit; text-decoration: none; }
    .mail:hover { background: var(--field); }
    .mail .head { display: flex; justify-content: space-between; gap: 8px; }
    .mail .from, .mail .subj, .mail .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mail .from { font-weight: 600; }
    .mail .time { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .mail .sum { color: var(--muted); font-size: 12px; }
    .msg { padding: 24px 4px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <h2>계정</h2>
    <div id="accountList"></div>
    <div class="aside-foot">
      <button id="refresh">↻ 새로고침</button>
      <button id="openOptions">⚙ 설정</button>
    </div>
  </aside>

  <main>
    <nav class="tabs">
      <button class="tab" data-view="inboxView">받은편지함 <span class="badge" id="unread"></span></button>
      <button class="tab" data-view="sendView">보내기</button>
    </nav>

    <section id="inboxView" hidden>
      <div class="inbox-bar">
        <span class="hint" id="inboxInfo"></span>
        <button class="primary" id="openGmail">Gmail 열기</button>
      </div>
      <div id="mailList"></div>
    </section>

    <section id="sendView" hidden>
      <div class="from-line" id="fromLine"></div>
      <div id="empty">등록된 수신자가 없습니다.<br><a id="goOptions">설정에서 이메일을 추가하세요</a></div>

      <div id="compose">
        <div class="row" style="justify-content:space-between;margin-top:10px">
          <label class="check" style="margin:0"><input type="checkbox" id="checkAll"> <b>받는 사람</b></label>
          <span class="hint" id="count"></span>
        </div>
        <div id="recipients"></div>

        <label for="subject">제목</label>
        <input type="text" id="subject">

        <label for="body">본문</label>
        <textarea id="body" rows="8"></textarea>

        <footer>
          <span class="hint" id="mode"></span>
          <div class="row">
            <span class="status" id="status"></span>
            <button class="primary" id="send">전송</button>
          </div>
        </footer>
      </div>
    </section>
  </main>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
