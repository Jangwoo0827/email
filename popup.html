<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 380px; padding: 14px; }
    #recipients { border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; }
    .recipient { margin: 0; padding: 6px 10px; cursor: pointer; }
    .recipient + .recipient { border-top: 1px solid var(--border); }
    .recipient:hover { background: var(--field); }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .mode { font-size: 11px; color: var(--muted); }
    #empty { display: none; padding: 12px; border: 1px dashed var(--border); border-radius: 8px; text-align: center; }
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    a { color: var(--accent); cursor: pointer; }
    .tabs { display: flex; gap: 4px; margin: 8px 0 4px; border-bottom: 1px solid var(--border); }
    .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; color: var(--muted); }
    .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
    .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; text-align: center; }
    .badge:empty { display: none; }
    [hidden] { display: none !important; }
    #mailList { max-height: 380px; overflow-y: auto; margin-top: 6px; }
    .mail { display: block; padding: 8px 4px; border-bottom: 1px solid var(--border); color: inherit; text-decoration: none; }
    .mail:hover { background: var(--field); }
    .mail .head { display: flex; justify-content: space-between; gap: 8px; }
    .mail .from, .mail .subj, .mail .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mail .from { font-weight: 600; }
    .mail .time { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .mail .sum { color: var(--muted); font-size: 12px; }
    .inbox-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .msg { padding: 16px 4px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Quick Email</h1>
    <span class="mode" id="mode"></span>
  </div>

  <nav class="tabs">
    <button class="tab" data-view="sendView">보내기</button>
    <button class="tab" data-view="inboxView">받은편지함 <span class="badge" id="unread"></span></button>
  </nav>

  <section id="inboxView" hidden>
    <div class="inbox-bar">
      <span class="hint" id="inboxInfo"></span>
      <div class="row">
        <button id="refresh">새로고침</button>
        <button class="primary" id="openGmail">Gmail 열기</button>
      </div>
    </div>
    <div id="mailList"></div>
  </section>

  <section id="sendView">
  <div id="empty">등록된 수신자가 없습니다.<br><a id="goOptions">설정에서 이메일을 추가하세요</a></div>

  <div id="main">
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <label class="check" style="margin:0"><input type="checkbox" id="checkAll"> <b>받는 사람</b></label>
      <span class="hint" id="count"></span>
    </div>
    <div id="recipients"></div>

    <label for="subject">제목</label>
    <input type="text" id="subject">

    <label for="body">본문</label>
    <textarea id="body" rows="8"></textarea>

    <footer>
      <a id="openOptions">설정</a>
      <div class="row">
        <span class="status" id="status"></span>
        <button class="primary" id="send">전송</button>
      </div>
    </footer>
  </div>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
