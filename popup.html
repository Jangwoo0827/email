<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 700px; }
    [hidden] { display: none !important; }
    a { color: var(--accent); cursor: pointer; }
    .layout { display: grid; grid-template-columns: 200px 1fr; height: 580px; }
    main { overflow-y: auto; }

    /* 왼쪽: 계정 */
    aside { border-right: 1px solid var(--border); background: var(--field); padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
    aside h2 { margin: 0 4px 6px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .acct { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 0; border-radius: 8px; background: none; text-align: left; color: var(--fg); }
    .acct:hover { background: var(--border); }
    .acct.active { background: var(--accent); color: var(--accent-fg); }
    .acct.active .hint { color: inherit; opacity: .85; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
    .acct .info { min-width: 0; overflow: hidden; }
    .acct .email, .acct .hint { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct .email { font-size: 12px; font-weight: 600; }
    .acct .hint { font-size: 11px; }
    .acct .badge { justify-self: end; }
    .badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; text-align: center; }
    .badge:empty { display: none; }
    .aside-msg { font-size: 12px; color: var(--muted); padding: 4px; }
    .diag { font-size: 11px; color: var(--muted); padding: 4px; word-break: break-all; }
    #accountList { display: flex; flex-direction: column; gap: 2px; }
    .aside-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
    .aside-foot button { font-size: 12px; padding: 5px 8px; }

    /* 오른쪽 */
    main { padding: 12px 14px; min-width: 0; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
    .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; color: var(--muted); }
    .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
    .from-line { margin-top: 10px; font-size: 12px; color: var(--muted); }
    .from-line b { color: var(--fg); }
    .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .acct .err { color: var(--danger); }
    .acct.active .err { color: inherit; }
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }

    .inbox-bar button { white-space: nowrap; flex: none; }
    .inbox-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    #mailList { max-height: 400px; overflow-y: auto; margin-top: 6px; }
    .mail { display: block; padding: 8px 4px; border-bottom: 1px solid var(--border); color: inherit; text-decoration: none; }
    .mail:hover { background: var(--field); }
    .mail .head { display: flex; justify-content: space-between; gap: 8px; }
    .mail .from, .mail .subj, .mail .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mail .from { font-weight: 600; }
    .mail .time { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .mail .sum { color: var(--muted); font-size: 12px; }
    .msg { padding: 24px 4px; color: var(--muted); text-align: center; }
    .mail { cursor: pointer; }
    .mail.unread .from, .mail.unread .subj { font-weight: 700; }
    .mail:not(.unread) .subj { color: var(--muted); }
    .reader-bar { margin-top: 8px; }
    .reader-bar .grow { flex: 1; }
    #rSubject { font-size: 15px; margin: 10px 0 4px; word-break: break-word; }
    #rMeta { font-size: 12px; word-break: break-all; }
    #rBody { margin-top: 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: #111; overflow: auto; }
    .reply-info { margin-top: 8px; font-size: 12px; padding: 6px 8px; border-radius: 6px; background: var(--field); display: flex; justify-content: space-between; gap: 8px; }
    select#filter { width: auto; padding: 5px 6px; }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <h2>계정</h2>
    <div id="accountList"></div>
    <div class="aside-foot">
      <button id="refresh">↻ 새로고침</button>
      <button id="openOptions">⚙ 설정</button>
    </div>
  </aside>

  <main>
    <nav class="tabs">
      <button class="tab" data-view="inboxView">받은편지함 <span class="badge" id="unread"></span></button>
      <button class="tab" data-view="sendView">보내기</button>
    </nav>

    <section id="inboxView" hidden>
      <div id="listPane">
        <div class="inbox-bar">
          <span class="hint" id="inboxInfo"></span>
          <div class="row">
            <button class="primary" id="openGmail">Gmail 열기</button>
          </div>
        </div>
        <div id="mailList"></div>
      </div>
      <div id="readerPane" hidden>
        <div class="row reader-bar">
          <button id="back">← 목록</button>
          <span class="grow"></span>
          <button class="primary" id="reply">답장</button>
          <button id="openInGmail">Gmail에서 열기</button>
        </div>
        <h3 id="rSubject"></h3>
        <div class="hint" id="rMeta"></div>
        <div class="hint" id="rAttach"></div>
        <div id="rBody"></div>
      </div>
    </section>

    <section id="sendView" hidden>
      <div class="from-line" id="fromLine"></div>
      <div class="reply-info" id="replyInfo" hidden><span id="replyText"></span><a id="cancelReply">답장 취소</a></div>
      <div id="compose">
        <label for="to">받는 사람 <span class="hint">여러 명은 쉼표(,)로 구분</span></label>
        <input type="text" id="to" list="toSuggest" placeholder="name@example.com" autocomplete="off" spellcheck="false">
        <datalist id="toSuggest"></datalist>

        <label for="subject">제목</label>
        <input type="text" id="subject">

        <label for="body">본문</label>
        <textarea id="body" rows="8"></textarea>

        <footer>
          <span class="hint">Gmail 작성창에서 최종 확인 후 보내기</span>
          <div class="row">
            <span class="status" id="status"></span>
            <button class="primary" id="send">보내기</button>
          </div>
        </footer>
      </div>
    </section>
  </main>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
